<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#12141a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Filialprotokoll" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>Filialprotokoll</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.2/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.12.3/JsBarcode.all.min.js"></script>

<style>
:root {
  --bg: #12141a;
  --surface: #1b1e27;
  --surface-2: #232733;
  --border: #2e3340;
  --text: #f1f2f5;
  --text-dim: #8b92a3;
  --accent: #6c7bf0;
  --ok: #34c77b;
  --warn: #f0654a;
}
.telekom { --accent: #e20074; }
.o2 { --accent: #0019a5; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button, input, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 92px; }

.kopf { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); padding: 14px 16px 0; }
.kopf-marke { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.kopf-badge { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 700; font-size: 12px; flex-shrink: 0; }
.kopf h1 { font-size: 17px; font-weight: 600; margin: 0; }
.abmelden-btn { margin-left: auto; background: none; border: none; color: var(--text-dim); font-size: 12px; cursor: pointer; padding: 4px; }
.kopf-felder { display: flex; gap: 8px; margin-bottom: 12px; }
.standort-select { flex: 1; min-width: 0; padding: 11px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; }
.datum-input { width: 138px; padding: 11px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; }
.tabs { display: flex; gap: 4px; }
.tabs button { flex: 1; padding: 10px 0; border: none; background: none; color: var(--text-dim); font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; cursor: pointer; }
.tabs button.aktiv { color: var(--text); border-color: var(--accent); }

main { padding: 4px 16px 24px; flex: 1; }

.abschnitt { padding: 18px 0 18px 14px; border-bottom: 1px solid var(--border); border-left: 3px solid var(--accent); margin-bottom: 4px; }
.abschnitt h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }

.kassen-tabelle { display: flex; flex-direction: column; gap: 16px; }
.gruppen-label { font-size: 12px; color: var(--text-dim); margin: 0 0 6px; }
.stueck-zeile { display: grid; grid-template-columns: 60px 1fr 82px; align-items: center; gap: 10px; padding: 6px 0; }
.stueck-label { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--text-dim); }
.stueck-zeile input { width: 100%; padding: 9px 8px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; text-align: center; font-variant-numeric: tabular-nums; }
.stueck-summe { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text-dim); text-align: right; }

.kassen-summe { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.summe-zeile { display: flex; align-items: center; justify-content: space-between; }
.summe-zeile > span { color: var(--text-dim); font-size: 14px; }
.summe-zeile strong { font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 600; }
.soll-input { width: 130px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
.summe-zeile.differenz strong { font-size: 23px; }
.summe-zeile.differenz.ok strong { color: var(--ok); }
.summe-zeile.differenz.warn strong { color: var(--warn); }

.toggle-zeile { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; font-size: 15px; }
.toggle { width: 46px; height: 27px; border-radius: 14px; border: none; background: var(--surface-2); position: relative; cursor: pointer; padding: 0; flex-shrink: 0; }
.toggle.an { background: var(--accent); }
.toggle-kugel { position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle.an .toggle-kugel { transform: translateX(19px); }

.foto-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.foto-thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.foto-thumb img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; display: block; }
.foto-entfernen { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,.62); color: #fff; font-size: 13px; line-height: 1; cursor: pointer; }
.foto-hinzufuegen { aspect-ratio: 1; border-radius: 10px; border: 1.5px dashed var(--border); background: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
.foto-hinzufuegen span:first-child { font-size: 20px; }
.foto-hinzufuegen-text { font-size: 10px; }

.lightbox, .modal { position: fixed; inset: 0; background: rgba(8,9,13,.88); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.lightbox-inner { max-width: 100%; max-height: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.lightbox-inner img { max-width: 100%; max-height: 68vh; border-radius: 10px; }
.lightbox-aktionen { display: flex; gap: 10px; }
.lightbox-aktionen button { padding: 10px 16px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; cursor: pointer; }

.unterschrift-bereich { display: flex; flex-direction: column; gap: 10px; }
.unterschrift-canvas { width: 100%; height: 150px; border-radius: 10px; background: #fff; touch-action: none; display: block; }

.fehler-banner { background: rgba(240,101,74,.12); border: 1px solid var(--warn); color: var(--warn); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin: 10px 0; }

.aktionen { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--border); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; max-width: 480px; margin: 0 auto; }
.aktionen button { padding: 13px 0; border-radius: 11px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-sekundaer { background: var(--surface-2); color: var(--text); flex: 0.7; }
.btn-primaer { background: var(--accent); color: #fff; flex: 1; }
.btn-outlook { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); flex: 1.1; }
.aktionen button:disabled { opacity: .6; }

.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { width: 100%; max-width: 340px; text-align: center; }
.login-icon { width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: #fff; display: grid; place-items: center; margin: 0 auto 16px; font-size: 22px; font-weight: 700; }
.login-card h1 { font-size: 20px; margin: 0 0 4px; }
.login-sub { color: var(--text-dim); font-size: 14px; margin: 0 0 24px; }
.login-card form { display: flex; flex-direction: column; gap: 14px; text-align: left; }
.login-card label { font-size: 13px; color: var(--text-dim); display: flex; flex-direction: column; gap: 6px; }
.login-card input { padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; }
.login-card button { margin-top: 6px; padding: 13px; border-radius: 11px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
.login-card button:disabled { opacity: .6; }
.login-fehler { color: var(--warn); font-size: 13px; text-align: left; }

.historie-status { color: var(--text-dim); text-align: center; padding: 40px 0; font-size: 14px; }
.historie-filter { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.historie-filter button { padding: 7px 13px; border-radius: 20px; border: 1px solid var(--border); background: none; color: var(--text-dim); font-size: 13px; cursor: pointer; }
.historie-filter button.aktiv { background: var(--accent); color: #fff; border-color: var(--accent); }
.historie-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.historie-liste li { background: var(--surface); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.historie-zeile-oben { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.marke-punkt { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.marke-punkt.telekom { background: #e20074; }
.marke-punkt.o2 { background: #0019a5; }
.historie-standort { font-size: 14px; font-weight: 500; flex: 1; }
.historie-datum { font-size: 13px; color: var(--text-dim); }
.historie-zeile-unten { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; }
.diff-ok { color: var(--ok); font-weight: 600; }
.diff-warn { color: var(--warn); font-weight: 600; }

.modal-inhalt { background: var(--surface); border-radius: 16px; padding: 22px; max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto; position: relative; }
.modal-schliessen { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--surface-2); color: var(--text); font-size: 16px; cursor: pointer; }
.modal-inhalt h2 { margin: 0 24px 2px 0; font-size: 17px; }
.modal-datum { color: var(--text-dim); font-size: 13px; margin: 0 0 16px; }
.modal-tabelle { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.modal-tabelle-zeile { display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text-dim); }
.modal-summen { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; margin-bottom: 12px; }
.modal-summen > div { display: flex; justify-content: space-between; font-size: 14px; }
.modal-summen .ok strong { color: var(--ok); }
.modal-summen .warn strong { color: var(--warn); }
.modal-checks { font-size: 13px; color: var(--text-dim); margin: 0 0 14px; }
.modal-unterschrift { max-width: 100%; margin-top: 14px; background: #fff; border-radius: 8px; display: block; }

.druckbereich { position: fixed; left: -9999px; top: 0; width: 700px; }
.druck-inhalt { background: #fff; color: #111; padding: 32px; font-family: -apple-system, Arial, sans-serif; }
.druck-inhalt h1 { font-size: 20px; margin: 0 0 4px; }
.druck-inhalt table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
.druck-inhalt td { padding: 4px 0; border-bottom: 1px solid #eee; }
.druck-fotos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
.druck-fotos img { width: 100%; border-radius: 6px; }
.druck-unterschrift { max-width: 220px; margin-top: 14px; }
.hauptmenue { display: flex; gap: 6px; margin-bottom: 4px; }
.hauptmenue button { flex: 1; padding: 9px 6px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.hauptmenue button.aktiv { background: var(--accent); color: #fff; border-color: var(--accent); }

.upload-hinweis { color: var(--text-dim); font-size: 13px; margin: 0 0 14px; }
.upload-btn { width: 100%; padding: 14px 0; border-radius: 11px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
.upload-dropzone { border: 2px dashed var(--border); border-radius: 14px; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
.upload-dropzone:hover { border-color: var(--accent); }
.upload-dropzone.ueber { border-color: var(--accent); background: var(--surface-2); }
.upload-dropzone-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); color: var(--accent); display: grid; place-items: center; font-size: 18px; }
.upload-dropzone-text { color: var(--text-dim); font-size: 13px; text-align: center; }
.upload-dropzone-text strong { color: var(--text); font-weight: 600; }
.upload-fortschritt p { color: var(--text-dim); font-size: 13px; margin: 10px 0 0; text-align: center; }
.upload-fortschritt-balken { height: 8px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.upload-fortschritt-fuellung { height: 100%; background: var(--accent); transition: width .2s; }

.abgleich-summe { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.abgleich-summe strong { font-size: 26px; font-variant-numeric: tabular-nums; }
.abgleich-summe span { color: var(--text-dim); font-size: 13px; }
.abgleich-balken { height: 8px; border-radius: 5px; background: var(--surface-2); overflow: hidden; margin-bottom: 16px; }
.abgleich-balken-fuellung { height: 100%; background: var(--ok); transition: width .2s; }
.abgleich-aktionen { display: flex; gap: 8px; }
.abgleich-aktionen button { flex: 1; padding: 12px 0; border-radius: 11px; font-size: 14px; font-weight: 600; cursor: pointer; }
.abgleich-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 50vh; overflow-y: auto; }
.such-feld { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; margin-bottom: 10px; }
.handscanner-form { display: flex; gap: 8px; }
.handscanner-input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
.handscanner-rueckmeldung { margin-top: 10px; padding: 11px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; text-align: center; }
.handscanner-rueckmeldung.gefunden { background: rgba(52,199,123,.16); color: var(--ok); border: 1px solid var(--ok); }
.handscanner-rueckmeldung.doppelt { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
.handscanner-rueckmeldung.unbekannt { background: rgba(240,101,74,.16); color: var(--warn); border: 1px solid var(--warn); }
.scanner-taschenlampe { position: absolute; top: 20px; right: 20px; padding: 9px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,.4); background: rgba(0,0,0,.45); color: #fff; font-size: 13px; cursor: pointer; }
.scanner-taschenlampe.an { background: rgba(255,255,255,.92); color: #111; }
.abgleich-liste li { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--border); font-size: 13px; }
.abgleich-liste li.gefunden { opacity: .55; }
.abgleich-status { color: var(--ok); font-weight: 700; }
.abgleich-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.abgleich-liste li.gefunden .abgleich-name { text-decoration: line-through; }
.abgleich-sn { color: var(--text-dim); font-variant-numeric: tabular-nums; font-size: 11.5px; }

.scanner-overlay { position: fixed; inset: 0; background: #000; z-index: 200; display: flex; align-items: center; justify-content: center; }
.scanner-video { width: 100%; height: 100%; object-fit: cover; }
.scanner-blitz { position: absolute; inset: 0; pointer-events: none; animation: blitz-aus .35s ease-out forwards; }
.scanner-blitz.gefunden { background: rgba(52,199,123,.35); }
.scanner-blitz.doppelt { background: rgba(255,255,255,.16); }
.scanner-blitz.unbekannt { background: rgba(240,101,74,.35); }
@keyframes blitz-aus { from { opacity: 1; } to { opacity: 0; } }
.scanner-rahmen { position: absolute; top: 30%; left: 8%; right: 8%; bottom: 40%; border: 2px solid rgba(255,255,255,.75); border-radius: 14px; pointer-events: none; overflow: hidden; }
.scanner-linie { position: absolute; left: 4%; right: 4%; top: 50%; height: 2px; background: #ff3b30; box-shadow: 0 0 8px 1px rgba(255,59,48,.8); transform: translateY(-50%); }
.scanner-treffer { position: absolute; bottom: 190px; left: 20px; right: 20px; padding: 12px 16px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 600; background: var(--ok); color: #0a1f14; }
.scanner-treffer.doppelt { background: var(--surface-2); color: #fff; }
.scanner-treffer.unbekannt { background: var(--warn); color: #2a0d06; }
.scanner-fehlertext { position: absolute; top: 20px; left: 20px; right: 20px; padding: 12px; border-radius: 10px; background: var(--warn); color: #2a0d06; font-size: 13px; text-align: center; }
.scanner-letzte { position: absolute; bottom: 122px; left: 20px; right: 20px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.scanner-letzte-zeile { background: rgba(0,0,0,.55); backdrop-filter: blur(2px); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px; display: flex; justify-content: space-between; gap: 8px; }
.scanner-letzte-zeile span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scanner-letzte-zeile span:last-child { opacity: .65; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.scanner-manuell { position: absolute; bottom: 66px; left: 20px; right: 20px; display: flex; gap: 8px; }
.scanner-manuell input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: none; font-size: 15px; background: rgba(255,255,255,.96); color: #111; font-variant-numeric: tabular-nums; }
.scanner-manuell button { padding: 0 18px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
.scanner-schliessen { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); padding: 11px 28px; border-radius: 20px; border: none; background: #fff; color: #111; font-size: 13px; font-weight: 700; cursor: pointer; }

.qr-bereich { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.qr-code { background: #fff; padding: 10px; border-radius: 12px; line-height: 0; }
.qr-hinweis { color: var(--text-dim); font-size: 13px; margin: 0; max-width: 300px; }

.bestand-druck table.original-format { width: 100%; border-collapse: collapse; font-size: 11px; }
/* PDF-Kopf: Maße entsprechend der gelieferten Vorlage (794 px A4-Vorschau). */
.druckbereich:has(.bestand-druck) { width: 794px; }
.druck-inhalt.bestand-druck { padding: 19px 38px; font-family: Arial, Helvetica, sans-serif; color: #000; }
.druck-kopf { position: relative; height: 124px; border: 1px solid #ddd; border-bottom: 0; }
.druck-logo { position: absolute; left: 17px; top: 17px; width: 76px; height: 76px; overflow: hidden; }
.druck-logo img { position: absolute; width: 831px; height: 360px; max-width: none; left: -69px; top: -52px; }
.druck-titel-block { text-align: center; }
.bestand-druck .druck-titel-block h1 { position: absolute; top: 12px; left: 0; width: 100%; font-size: 27px; line-height: 32px; margin: 0; font-weight: 700; }
.druck-shop { position: absolute; top: 62px; left: 95px; right: 95px; font-size: 13px; line-height: 17px; color: #000; margin: 0; }
.druck-zeitstempel { position: absolute; right: 20px; top: 43px; font-size: 13px; line-height: 17px; color: #000; white-space: nowrap; margin: 0; }
.druck-meta-zeile { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; height: 46px; padding: 0 8px 14px; border-left: 1px solid #ddd; border-right: 1px solid #ddd; font-size: 13px; line-height: 17px; }
.druck-meta-zeile > span { display: flex; align-items: center; border-bottom: 1px solid #e5e5e5; padding: 0 11px; white-space: nowrap; }
.druck-meta-zeile strong { margin-right: 11px; }
.druck-meta-zeile > span:last-child strong { width: 111px; flex-shrink: 0; }
.bestand-druck table.original-format { margin-top: 0; }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

// ===== Hilfsfunktionen =====
function euro(n) {
  return new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" }).format(n || 0);
}
function heuteISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}
function datumDE(iso) {
  if (!iso) return "";
  const [j, m, t] = iso.split("-");
  return `${t}.${m}.${j}`;
}
function parseDezimal(str) {
  if (str === "" || str === null || str === undefined) return 0;
  const n = Number(String(str).replace(",", "."));
  return isNaN(n) ? 0 : n;
}
function login_fehlertext(err) {
  const code = err && err.code;
  if (code === "auth/invalid-email") return "Ungültige E-Mail-Adresse.";
  if (code === "auth/user-not-found" || code === "auth/wrong-password" || code === "auth/invalid-credential") return "E-Mail oder Passwort falsch.";
  if (code === "auth/too-many-requests") return "Zu viele Versuche. Später erneut probieren.";
  return "Anmeldung fehlgeschlagen.";
}
function speicherfehlertext(err) {
  const code = err && err.code;
  if (code === "permission-denied") return "Kein Zugriff auf die Datenbank - sind die Firestore-Regeln in der Firebase-Konsole veröffentlicht? (siehe README.md)";
  if (code === "unavailable") return "Keine Verbindung zur Datenbank. Internet prüfen und erneut versuchen.";
  return (err && err.message) || "Speichern fehlgeschlagen.";
}

function komprimiereBild(datei) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onerror = () => resolve(null);
    reader.onload = () => {
      const rohDaten = reader.result;
      const img = new Image();
      img.onerror = () => resolve(rohDaten);
      img.onload = () => {
        try {
          const maxSeite = 1280;
          let { width, height } = img;
          if (width > height && width > maxSeite) { height = Math.round((height * maxSeite) / width); width = maxSeite; }
          else if (height > maxSeite) { width = Math.round((width * maxSeite) / height); height = maxSeite; }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", 0.68));
        } catch (e) {
          resolve(rohDaten);
        }
      };
      img.src = rohDaten;
    };
    reader.readAsDataURL(datei);
  });
}

async function erstellePdf(element, dateiname) {
  await document.fonts.ready;
  await Promise.all(Array.from(element.querySelectorAll("img")).map(img => img.decode().catch(() => {})));
  const scale = 2;
  const containerOben = element.getBoundingClientRect().top;
  // Grenzen aller Tabellenzeilen merken (in CSS-Pixel relativ zum Element), damit der Seitenschnitt
  // nie mitten durch eine Zeile (z.B. S/N-Text + Barcode) geht, sondern immer dazwischen.
  const zeilenGrenzenPx = Array.from(element.querySelectorAll("tr")).map(
    (z) => (z.getBoundingClientRect().bottom - containerOben) * scale
  );

  const canvas = await html2canvas(element, { scale, backgroundColor: "#ffffff", useCORS: true });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p", "mm", "a4");
  const seitenBreiteMm = 210;
  const seitenHoeheMm = 297;
  const seitenHoehePx = (seitenHoeheMm * canvas.width) / seitenBreiteMm;

  let versatzPx = 0;
  let ersteSeite = true;
  while (versatzPx < canvas.height - 2) {
    const maxEndePx = Math.min(versatzPx + seitenHoehePx, canvas.height);
    const passendeGrenze = [...zeilenGrenzenPx].reverse().find((g) => g > versatzPx + 5 && g <= maxEndePx);
    const schnittPx = passendeGrenze || maxEndePx;
    const hoehePx = Math.max(1, Math.round(schnittPx - versatzPx));

    const seiteCanvas = document.createElement("canvas");
    seiteCanvas.width = canvas.width;
    seiteCanvas.height = hoehePx;
    seiteCanvas.getContext("2d").drawImage(canvas, 0, -Math.round(versatzPx));
    const seiteBild = seiteCanvas.toDataURL("image/jpeg", 0.85);

    if (!ersteSeite) pdf.addPage();
    ersteSeite = false;
    const hoeheMm = (hoehePx * seitenBreiteMm) / canvas.width;
    pdf.addImage(seiteBild, "JPEG", 0, 0, seitenBreiteMm, hoeheMm);

    versatzPx += hoehePx;
  }
  pdf.save(`${dateiname}.pdf`);
}

function oeffneMailto({ standort, datum, ist, soll, differenz, staubgesaugt, zumutbar }) {
  const betreff = `Kassenprotokoll ${standort.name} - ${datumDE(datum)}`;
  const text = [
    `Standort: ${standort.name}`,
    `Datum: ${datumDE(datum)}`,
    ``,
    `Ist-Bestand: ${euro(ist)}`,
    `Soll-Bestand: ${euro(soll)}`,
    `Differenz: ${differenz > 0 ? "+" : ""}${euro(differenz)}`,
    ``,
    `Staub gesaugt: ${staubgesaugt ? "Ja" : "Nein"}`,
    `Alles zumutbar: ${zumutbar ? "Ja" : "Nein"}`,
    ``,
    `Das PDF wurde separat heruntergeladen - bitte an diese Mail anhängen.`,
  ].join("\n");
  const link = `mailto:${EMPFAENGER_EMAIL}?subject=${encodeURIComponent(betreff)}&body=${encodeURIComponent(text)}`;
  window.location.href = link;
}

async function protokollSpeichern({ standort, datum, stueck, ist, soll, differenz, staubgesaugt, zumutbar, fotos, unterschrift }) {
  const jetzt = firebase.firestore.Timestamp.now();
  const ablauf = firebase.firestore.Timestamp.fromMillis(Date.now() + AUFBEWAHRUNG_TAGE * 86400000);
  const stueckZahlen = Object.fromEntries(STUECKELUNG.map((s) => [String(s.wert), Number(stueck[s.wert]) || 0]));

  const ref = await db.collection("protokolle").add({
    standortId: standort.id,
    standortName: standort.name,
    marke: standort.marke,
    datum,
    stueckelung: stueckZahlen,
    ist,
    soll,
    differenz,
    staubgesaugt,
    zumutbar,
    unterschrift: unterschrift || null,
    fotoAnzahl: fotos.length,
    erstelltVon: auth.currentUser ? auth.currentUser.email : null,
    erstelltAm: jetzt,
    ablaufAm: ablauf,
  });

  for (let i = 0; i < fotos.length; i++) {
    await ref.collection("fotos").add({ reihenfolge: i, daten: fotos[i].dataUrl });
  }
  return ref.id;
}

function Section({ title, children }) {

}

function StueckZeile({ s, anzahl, onChange }) {

}

function KassenTabelle({ stueck, onChange }) {

function Lightbox({ foto, onClose }) {

function FotoGrid({ fotos, onHinzufuegen, onEntfernen, onOeffnen }) {
  const inputRef = useRef(null);
  return (
    <div>
      <div className="foto-grid">
        {fotos.map((f) => (
          <div className="foto-thumb" key={f.id}>
            <img src={f.dataUrl} onClick={() => onOeffnen(f)} alt="Fotoprotokoll" />
            <button type="button" className="foto-entfernen" onClick={() => onEntfernen(f.id)} aria-label="Foto entfernen">×</button>
          </div>
        ))}
        {fotos.length < 12 && (
          <button type="button" className="foto-hinzufuegen" onClick={() => inputRef.current.click()}>
            <span>+</span>
            <span className="foto-hinzufuegen-text">Foto</span>
          </button>
        )}
      </div>
      <input
        ref={inputRef}
        type="file"
        accept="image/*"
        multiple
        style={{ display: "none" }}
        onChange={(e) => {
          if (e.target.files.length) onHinzufuegen(e.target.files);
          e.target.value = "";
        }}
      />
    </div>
  );
}

function Unterschriftsfeld({ value, onChange }) {
  const canvasRef = useRef(null);
  const zeichnetRef = useRef(false);
  const letzterPunktRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#1a1d27";
    if (value) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
      img.src = value;
    }
    // eslint-disable-next-line
  }, []);

  function position(e) {
    const rect = canvasRef.current.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function start(e) {
    e.preventDefault();
    zeichnetRef.current = true;
    letzterPunktRef.current = position(e);
  }
  function bewegen(e) {
    if (!zeichnetRef.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const punkt = position(e);
    ctx.beginPath();
    ctx.moveTo(letzterPunktRef.current.x, letzterPunktRef.current.y);
    ctx.lineTo(punkt.x, punkt.y);
    ctx.stroke();
    letzterPunktRef.current = punkt;
  }
  function ende() {
    if (!zeichnetRef.current) return;
    zeichnetRef.current = false;
    onChange(canvasRef.current.toDataURL("image/png"));
  }
  function loeschen() {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    onChange(null);
  }

  return (
    <div className="unterschrift-bereich">
      <canvas
        ref={canvasRef}
        className="unterschrift-canvas"
        onMouseDown={start}
        onMouseMove={bewegen}
        onMouseUp={ende}
        onMouseLeave={ende}
        onTouchStart={start}
        onTouchMove={bewegen}
        onTouchEnd={ende}
      />
      <button type="button" className="btn-sekundaer" onClick={loeschen} style={{ alignSelf: "flex-start", padding: "9px 16px" }}>
        Löschen
      </button>
    </div>
  );
}

function DruckAnsicht({ standort, datum, stueck, ist, soll, differenz, staubgesaugt, zumutbar, fotos, unterschrift }) {
  const belegt = STUECKELUNG.filter((s) => Number(stueck[s.wert]) > 0);
  return (
    <div className="druck-inhalt">
      <h1>Filialprotokoll</h1>
      <p>{standort.name} · {datumDE(datum)}</p>
      <table>
        <tbody>
          {belegt.map((s) => (
            <tr key={s.wert}>
              <td>{euro(s.wert)}</td>
              <td>× {stueck[s.wert]}</td>
              <td>{euro(s.wert * (Number(stueck[s.wert]) || 0))}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <p>Ist-Bestand: {euro(ist)}</p>
      <p>Soll-Bestand: {euro(soll)}</p>
      <p>Differenz: {differenz > 0 ? "+" : ""}{euro(differenz)}</p>
      <p>Staub gesaugt: {staubgesaugt ? "Ja" : "Nein"} · Alles zumutbar: {zumutbar ? "Ja" : "Nein"}</p>
      {fotos.length > 0 && (
        <div className="druck-fotos">
          {fotos.map((f) => <img key={f.id} src={f.dataUrl} alt="" />)}
        </div>
      )}
      {unterschrift && <img className="druck-unterschrift" src={unterschrift} alt="Unterschrift" />}
    </div>
  );
}

// ===== Neues Protokoll =====
function NeuesProtokoll({ standort, datum, onGespeichert }) {
  const leereStueck = () => Object.fromEntries(STUECKELUNG.map((s) => [s.wert, ""]));
  const [stueck, setStueck] = useState(leereStueck);
  const [soll, setSoll] = useState("");
  const [staubgesaugt, setStaubgesaugt] = useState(false);
  const [zumutbar, setZumutbar] = useState(false);
  const [fotos, setFotos] = useState([]);
  const [unterschrift, setUnterschrift] = useState(null);
  const [lightboxFoto, setLightboxFoto] = useState(null);
  const [status, setStatus] = useState("idle");
  const [fehlerText, setFehlerText] = useState("");
  const druckRef = useRef(null);

  const ist = useMemo(() => STUECKELUNG.reduce((summe, s) => summe + (Number(stueck[s.wert]) || 0) * s.wert, 0), [stueck]);
  const sollNum = parseDezimal(soll);
  const differenz = Math.round((ist - sollNum) * 100) / 100;

  function stueckAendern(wert, val) {
    if (val !== "" && !/^\d{0,3}$/.test(val)) return;
    setStueck((prev) => ({ ...prev, [wert]: val }));
  }

  async function fotosHinzufuegen(fileList) {
    const dateien = Array.from(fileList).slice(0, Math.max(0, 12 - fotos.length));
    for (const datei of dateien) {
      const dataUrl = await komprimiereBild(datei);
      if (dataUrl) setFotos((prev) => [...prev, { id: crypto.randomUUID(), dataUrl }]);
    }
  }
  function fotoEntfernen(id) {
    setFotos((prev) => prev.filter((f) => f.id !== id));
  }

  function formularZuruecksetzen() {
    setStueck(leereStueck());
    setSoll("");
    setStaubgesaugt(false);
    setZumutbar(false);
    setFotos([]);
    setUnterschrift(null);
    setStatus("idle");
    setFehlerText("");
  }

  async function speichern() {
    setStatus("speichert");
    setFehlerText("");
    try {
      await protokollSpeichern({ standort, datum, stueck, ist, soll: sollNum, differenz, staubgesaugt, zumutbar, fotos, unterschrift });
      setStatus("gespeichert");
      setTimeout(() => {
        formularZuruecksetzen();
        onGespeichert();
      }, 500);
    } catch (err) {
      setStatus("fehler");
      setFehlerText(speicherfehlertext(err));
      console.error("Speichern fehlgeschlagen:", err);
    }
  }

  async function perOutlookSenden() {
    setStatus("sende");
    setFehlerText("");
    try {
      await protokollSpeichern({ standort, datum, stueck, ist, soll: sollNum, differenz, staubgesaugt, zumutbar, fotos, unterschrift });
      await erstellePdf(druckRef.current, `Kassenprotokoll_${standort.id}_${datum}`);
      oeffneMailto({ standort, datum, ist, soll: sollNum, differenz, staubgesaugt, zumutbar });
      setStatus("gespeichert");
      setTimeout(() => {
        formularZuruecksetzen();
        onGespeichert();
      }, 500);
    } catch (err) {
      setStatus("fehler");
      setFehlerText(speicherfehlertext(err));
      console.error("Senden fehlgeschlagen:", err);
    }
  }

  return (
    <div>
      <Section title="Kassenprotokoll">
        <KassenTabelle stueck={stueck} onChange={stueckAendern} />
        <div className="kassen-summe">
          <div className="summe-zeile">
            <span>Ist-Bestand</span>
            <strong>{euro(ist)}</strong>
          </div>
          <div className="summe-zeile">
            <span>Soll-Bestand</span>
            <input className="soll-input" type="text" inputMode="decimal" value={soll} onChange={(e) => setSoll(e.target.value)} placeholder="0,00" />
          </div>
          <div className={`summe-zeile differenz ${differenz === 0 ? "ok" : "warn"}`}>
            <span>Differenz</span>
            <strong>{differenz > 0 ? "+" : ""}{euro(differenz)}</strong>
          </div>
        </div>
      </Section>

      <Section title="Sauberkeit">
        <Toggle label="Staub gesaugt" checked={staubgesaugt} onChange={setStaubgesaugt} />
        <Toggle label="Alles zumutbar" checked={zumutbar} onChange={setZumutbar} />
      </Section>

      <Section title="Fotoprotokoll">
        <FotoGrid fotos={fotos} onHinzufuegen={fotosHinzufuegen} onEntfernen={fotoEntfernen} onOeffnen={setLightboxFoto} />
      </Section>

      <Section title="Unterschrift">
        <Unterschriftsfeld value={unterschrift} onChange={setUnterschrift} />
      </Section>

      {fehlerText && <div className="fehler-banner">{fehlerText}</div>}

      <div className="aktionen">
        <button type="button" className="btn-sekundaer" onClick={formularZuruecksetzen}>Zurücksetzen</button>
        <button type="button" className="btn-primaer" onClick={speichern} disabled={status === "speichert" || status === "sende"}>
          {status === "speichert" ? "Speichert…" : status === "gespeichert" ? "Gespeichert ✓" : "Speichern"}
        </button>
        <button type="button" className="btn-outlook" onClick={perOutlookSenden} disabled={status === "speichert" || status === "sende"}>

let pdfjsPromise = null;
function ladePdfJs() {
  if (!pdfjsPromise) {
    pdfjsPromise = import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.mjs").then((mod) => {
      mod.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.mjs";
      return mod;
    });
  }
  return pdfjsPromise;
}
let tesseractPromise = null;
function ladeTesseract() {
  if (!tesseractPromise) {
    tesseractPromise = import("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js");
  }
  return tesseractPromise;
}
function ladeBarcodeDetector() {
  return import("https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.js");
}

const BESTAND_STOPWORTE = new Set([
  "JA", "NEIN", "DEMOS", "SMARTPHONES", "KOMMISSIONSWARENLAGER", "KOMMISSIONSWARENLAG", "LAGERART", "ER",
  "ZEIL", "ZEILE", "ARTIKELGRUPP", "ARTIKELGRUPPE", "SERIENNUMM", "SERIENNUMMER",
  "GEFUHRT", "GEFÜHRT", "MENG", "MENGE", "NUMM", "NUMMER", "NAME", "SEITE", "NR",
  "HANDSET", "ACCESSORIES", "ARTIKELNUMME", "ARTIKELNAME",
]);
function bereinigeArtikelname(roh) {
  const worte = roh
    .replace(/[\r\n]+/g, " ")
    .split(/\s+/)
    .filter((w) => {
      if (!w) return false;
      const norm = w.toUpperCase().replace(/[^A-ZÄÖÜ]/g, "");
      if (BESTAND_STOPWORTE.has(norm)) return false;
      if (/^\d{1,2}$/.test(w)) return false;
      if (/^[A-Za-zÄÖÜäöü]$/.test(w)) return false;
      if (!/[A-Za-zÄÖÜäöü0-9]/.test(w)) return false;
      return true;
    });
  return worte.join(" ").replace(/\s+([,.])/g, "$1").trim();
}

function parseBestandstext(text) {
  const artikelRegex = /\d{4}-\d{6}-\d/g;
  const treffer = [];
  let m;
  while ((m = artikelRegex.exec(text))) {
    treffer.push({ nummer: m[0], index: m.index, ende: artikelRegex.lastIndex });
  }

  const seriennummerArtikel = [];
  const zubehoerArtikel = [];
  for (let i = 0; i < treffer.length; i++) {
    const block = text.slice(treffer[i].ende, i + 1 < treffer.length ? treffer[i + 1].index : text.length);
    // zweite Ziffer der Artikel-Nummer steht durch den Spaltenumbruch meist am Anfang der nächsten Zeile (z.B. "...-0" + "0")
    const zweiteZiffer = block.match(/^\s*(\d)\b/);
    const nummer = treffer[i].nummer + (zweiteZiffer ? zweiteZiffer[1] : "0");
    // Zeile-Nummer steht im Original direkt vor der Artikel-Nummer (kleine OCR-Störzeichen dazwischen tolerieren)
    const vorText = text.slice(Math.max(0, treffer[i].index - 10), treffer[i].index);
    const zeileMatch = vorText.match(/(\d{1,3})[^\d]{0,6}$/);
    const zeile = zeileMatch ? zeileMatch[1] : "";

    const snMatch = block.match(/S\s*[\/I]\s*N\s*:?\s*([\d][\d,.\s]{4,})/i);
    if (snMatch) {
      const seriennummern = [...new Set(snMatch[1].match(/\d{6,20}/g) || [])];
      if (seriennummern.length === 0) continue;
      const name = bereinigeArtikelname(block.slice(0, snMatch.index)) || nummer;
      seriennummerArtikel.push({ artikelNummer: nummer, name, zeile, seriennummern });
    } else {
      // Zubehör ohne Seriennummer (Seriennummer geführt = NEIN): Menge steht direkt nach "NEIN"
      const mengeMatch = block.match(/NEIN\s+(\d{1,4})\b/i);
      if (!mengeMatch) continue;
      const name = bereinigeArtikelname(block) || nummer;
      zubehoerArtikel.push({ artikelNummer: nummer, name, zeile, menge: Number(mengeMatch[1]) });
    }
  }
  const einheiten = seriennummerArtikel.flatMap((e) =>
    e.seriennummern.map((sn) => ({ sn, artikelNummer: e.artikelNummer, name: e.name, zeile: e.zeile, gefunden: false }))
  );

  const shopMatch = text.match(/(\d{5,8}).{0,15}?Partner Shop\s+([^\n]+?)(?:\n|$)/i);
  const loginMatch = text.match(/Login.{0,15}?(\d{6,8})/i);
  const shopNummer = shopMatch ? shopMatch[1] : "";
  const shopName = shopMatch ? `o2 Partner Shop ${shopMatch[2].trim()}` : "";
  const loginKuerzel = loginMatch ? loginMatch[1] : "";

  return { einheiten, zubehoer: zubehoerArtikel, shopNummer, shopName, loginKuerzel };
}

async function verarbeitePdf(datei, onFortschritt) {
  const [pdfjsLib, TesseractMod] = await Promise.all([ladePdfJs(), ladeTesseract()]);
  const arrayBuffer = await datei.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const worker = await TesseractMod.default.createWorker("eng");
  await worker.setParameters({ tessedit_pageseg_mode: "6" });
  let volltext = "";
  try {
    for (let i = 1; i <= pdf.numPages; i++) {
      onFortschritt(i, pdf.numPages);
      const seite = await pdf.getPage(i);
      const viewport = seite.getViewport({ scale: 3 });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await seite.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      const { data } = await worker.recognize(canvas);
      volltext += "\n" + data.text;
    }
  } finally {
    await worker.terminate();
  }
  return parseBestandstext(volltext);
}

async function erstelleBestandsSession(standort, einheiten, zubehoer, kopf) {
  const jetzt = firebase.firestore.Timestamp.now();
  const ablauf = firebase.firestore.Timestamp.fromMillis(Date.now() + AUFBEWAHRUNG_TAGE * 86400000);
  const ref = await db.collection("bestandssessions").add({
    standortId: standort.id,
    standortName: standort.name,
    marke: standort.marke,
    zubehoer: zubehoer || [],
    shopNummer: (kopf && kopf.shopNummer) || "",
    shopName: (kopf && kopf.shopName) || "",
    loginKuerzel: (kopf && kopf.loginKuerzel) || "",
    erstelltVon: auth.currentUser ? auth.currentUser.email : null,
    erstelltAm: jetzt,
    ablaufAm: ablauf,
  });
  for (let i = 0; i < einheiten.length; i += 450) {
    const batch = db.batch();
    for (const e of einheiten.slice(i, i + 450)) {
      batch.set(ref.collection("einheiten").doc(e.sn), { artikelNummer: e.artikelNummer, name: e.name, gefunden: false });
    }
    await batch.commit();
  }
  return ref.id;
}

let geteilterAudioCtx = null;
function spieleTon(art) {
  try {
    if (!geteilterAudioCtx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      geteilterAudioCtx = new AudioCtx();
    }
    const ctx = geteilterAudioCtx;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const jetzt = ctx.currentTime;
    function ton(start, dauer, frequenz) {
      const osz = ctx.createOscillator();
      const gain = ctx.createGain();
      osz.type = "sine";
      osz.frequency.value = frequenz;
      gain.gain.setValueAtTime(0.0001, jetzt + start);
      gain.gain.exponentialRampToValueAtTime(0.22, jetzt + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, jetzt + start + dauer);
      osz.connect(gain);
      gain.connect(ctx.destination);
      osz.start(jetzt + start);
      osz.stop(jetzt + start + dauer + 0.02);
    }
    if (art === "gefunden") ton(0, 0.11, 1050);
    else if (art === "doppelt") ton(0, 0.09, 700);
    else {
      ton(0, 0.09, 480);
      ton(0.12, 0.13, 320);
    }
  } catch (e) {
    // Web Audio evtl. nicht verfügbar/erlaubt - Ton einfach auslassen
  }
}

// Gemeinsame Bewertung eines erfassten Codes (Kamera, Handscanner/PC oder manuelle Eingabe)
function bewerteCode(rohWert, einheitenListe, onTreffer) {
  const wert = (rohWert || "").replace(/\D/g, "");
  if (!wert) return null;
  const einheit = einheitenListe.find((e) => e.sn === wert);
  let ergebnis;
  if (einheit && !einheit.gefunden) {
    onTreffer(wert);
    ergebnis = { art: "gefunden", text: einheit.name, wert };
  } else if (einheit) {
    ergebnis = { art: "doppelt", text: "Bereits erfasst", wert };
  } else {
    ergebnis = { art: "unbekannt", text: `${wert} nicht in der Liste`, wert };
  }
  spieleTon(ergebnis.art);
  return ergebnis;
}

function Kamerascanner({ einheiten, onTreffer, onClose }) {
  const videoRef = useRef(null);
  const [fehler, setFehler] = useState("");
  const [meldung, setMeldung] = useState(null);
  const [blitz, setBlitz] = useState(null);
  const [letzteScans, setLetzteScans] = useState([]);
  const [manuellerWert, setManuellerWert] = useState("");
  const [taschenlampeAn, setTaschenlampeAn] = useState(false);
  const [taschenlampeVerfuegbar, setTaschenlampeVerfuegbar] = useState(false);
  const streamRef = useRef(null);
  const detectorRef = useRef(null);
  const laeuftRef = useRef(true);
  const einheitenRef = useRef(einheiten);
  const letzterRef = useRef({ code: null, zeit: 0 });

  useEffect(() => {
    einheitenRef.current = einheiten;
  }, [einheiten]);

  function verarbeiteCode(rohWert) {
    const ergebnis = bewerteCode(rohWert, einheitenRef.current, onTreffer);
    if (!ergebnis) return;
    setMeldung({ text: ergebnis.text, art: ergebnis.art });
    if (ergebnis.art === "gefunden") {
      if (navigator.vibrate) navigator.vibrate(80);
      setLetzteScans((prev) => [{ sn: ergebnis.wert, text: ergebnis.text }, ...prev].slice(0, 3));
    }
    if (ergebnis.art === "unbekannt" && navigator.vibrate) navigator.vibrate([40, 60, 40]);
    setBlitz(ergebnis.art);
    setTimeout(() => setBlitz(null), 350);
    setTimeout(() => setMeldung(null), 1600);
  }

  function manuellAbsenden(e) {
    e.preventDefault();
    verarbeiteCode(manuellerWert);
    setManuellerWert("");
  }

  function taschenlampeUmschalten() {
    const stream = streamRef.current;
    if (!stream) return;
    const spur = stream.getVideoTracks()[0];
    if (!spur) return;
    const neu = !taschenlampeAn;
    spur
      .applyConstraints({ advanced: [{ torch: neu }] })
      .then(() => setTaschenlampeAn(neu))
      .catch(() => {});
  }

  useEffect(() => {
    laeuftRef.current = true;
    const erfassCanvas = document.createElement("canvas");
    const erfassCtx = erfassCanvas.getContext("2d", { willReadFrequently: true });

    async function starten() {
      try {
        const mod = await ladeBarcodeDetector();
        detectorRef.current = new mod.BarcodeDetector({ formats: ["code_128"] });
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment",
            width: { ideal: 3840 },
            height: { ideal: 2160 },
            advanced: [{ focusMode: "continuous" }],
          },
        });
        streamRef.current = stream;
        if (!laeuftRef.current) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        const spur = stream.getVideoTracks()[0];
        try {
          const faehigkeiten = spur.getCapabilities ? spur.getCapabilities() : {};
          if (faehigkeiten.torch) setTaschenlampeVerfuegbar(true);
        } catch (e) {
          // Capabilities-API evtl. nicht unterstützt - Taschenlampe einfach ausblenden
        }
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
        }
        schleife();
      } catch (err) {
        setFehler(err && err.message ? err.message : "Kamera/Scanner konnte nicht gestartet werden - manuelle Eingabe geht trotzdem.");
      }
    }
    async function schleife() {
      let fehlerFolge = 0;
      while (laeuftRef.current) {
        try {
          const video = videoRef.current;
          if (video && video.readyState >= 2 && detectorRef.current && video.videoWidth) {
            if (erfassCanvas.width !== video.videoWidth) {
              erfassCanvas.width = video.videoWidth;
              erfassCanvas.height = video.videoHeight;
            }
            erfassCtx.drawImage(video, 0, 0, erfassCanvas.width, erfassCanvas.height);
            const codes = await detectorRef.current.detect(erfassCanvas);
            fehlerFolge = 0;
            if (codes.length > 0) {
              // Bei mehreren gleichzeitig sichtbaren Codes (z.B. IMEI1 + IMEI2) den bevorzugen,
              // der wirklich in der Liste steht, statt blind den ersten erkannten zu nehmen.
              const werte = codes.map((c) => (c.rawValue || "").replace(/\D/g, "")).filter(Boolean);
              const treffer = werte.find((w) => einheitenRef.current.some((e) => e.sn === w)) || werte[0];
              const jetzt = Date.now();
              if (treffer && (treffer !== letzterRef.current.code || jetzt - letzterRef.current.zeit > 1500)) {
                letzterRef.current = { code: treffer, zeit: jetzt };
                verarbeiteCode(treffer);
              }
            }
          }
        } catch (e) {
          fehlerFolge++;
          if (fehlerFolge === 5) {
            setFehler(`Scanner-Fehler: ${e && e.message ? e.message : e} - manuelle Eingabe geht trotzdem.`);
            console.error("Barcode-Erkennung fehlgeschlagen:", e);
          }
        }
        await new Promise((r) => setTimeout(r, 200));
      }
    }
    starten();
    return () => {
      laeuftRef.current = false;
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    };
  }, []);

  return (
    <div className="scanner-overlay">
      <video ref={videoRef} className="scanner-video" playsInline muted />
      {blitz && <div className={`scanner-blitz ${blitz}`} />}
      <div className="scanner-rahmen">
        <div className="scanner-linie" />
      </div>
      {taschenlampeVerfuegbar && (
        <button type="button" className={`scanner-taschenlampe ${taschenlampeAn ? "an" : ""}`} onClick={taschenlampeUmschalten}>
          {taschenlampeAn ? "☀︎ Licht aus" : "☾ Licht an"}
        </button>
      )}
      <form className="scanner-manuell" onSubmit={manuellAbsenden}>
        <input
          type="text"
          inputMode="numeric"
          placeholder="IMEI/S/N manuell eingeben"
          value={manuellerWert}
          onChange={(e) => setManuellerWert(e.target.value)}
        />
        <button type="submit">Erfassen</button>
      </form>
      {letzteScans.length > 0 && (
        <div className="scanner-letzte">
          {letzteScans.map((s, i) => (
            <div className="scanner-letzte-zeile" key={s.sn + i}>
              <span>{s.text}</span>
              <span>…{s.sn.slice(-4)}</span>
            </div>
          ))}
        </div>
      )}
      {meldung && <div className={`scanner-treffer ${meldung.art}`}>{meldung.text}</div>}
      {fehler && <div className="scanner-fehlertext">{fehler}</div>}
      <button type="button" className="scanner-schliessen" onClick={onClose}>Fertig</button>
    </div>
  );
}

function FehlendBarcode({ wert }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !window.JsBarcode || !wert) return;
    try {
      window.JsBarcode(ref.current, wert, { format: "CODE128", width: 2, height: 34, displayValue: false, margin: 0 });
    } catch (e) {
      // Barcode konnte nicht gerendert werden - Zahl bleibt trotzdem als Text sichtbar
    }
  }, [wert]);
  return <svg ref={ref} className="fehlend-barcode" />;
}

function gruppiereNachArtikel(einheiten) {
  const gruppen = new Map();
  for (const e of einheiten) {
    if (!gruppen.has(e.artikelNummer)) {
      gruppen.set(e.artikelNummer, { artikelNummer: e.artikelNummer, name: e.name, zeile: e.zeile, einheiten: [] });
    }
    gruppen.get(e.artikelNummer).einheiten.push(e);
  }
  return [...gruppen.values()];
}

function BestandQr({ sessionId }) {
  const containerRef = useRef(null);
  const url = `${window.location.origin}${window.location.pathname}?bestand=${sessionId}`;

  useEffect(() => {
    if (!containerRef.current || !window.QRCode) return;
    containerRef.current.innerHTML = "";
    new window.QRCode(containerRef.current, {
      text: url,
      width: 168,
      height: 168,
      colorDark: "#12141a",
      colorLight: "#ffffff",
      correctLevel: window.QRCode.CorrectLevel.M,
    });
  }, [sessionId]);

  return (
    <Section title="Mit Handy weiterscannen">
      <div className="qr-bereich">
        <div ref={containerRef} className="qr-code" />
        <p className="qr-hinweis">QR-Code mit dem Handy scannen (normale Kamera-App reicht), um diese Liste dort zu öffnen und weiterzuscannen.</p>
      </div>
    </Section>
  );
}

function HandscannerEingabe({ einheiten, onTreffer }) {
  const [wert, setWert] = useState("");
  const [rueckmeldung, setRueckmeldung] = useState(null);
  const inputRef = useRef(null);

  function absenden(e) {
    e.preventDefault();
    const eingabe = wert;
    setWert("");
    const ergebnis = bewerteCode(eingabe, einheiten, onTreffer);
    if (ergebnis) {
      setRueckmeldung({ text: ergebnis.text, art: ergebnis.art });
      setTimeout(() => setRueckmeldung(null), 1400);
    }
    if (inputRef.current) inputRef.current.focus();
  }

  return (
    <Section title="Scanner-Eingabe (PC-Handscanner oder Tastatur)">
      <p className="upload-hinweis">Feld fokussiert lassen - ein angeschlossener Handscanner "tippt" den Code automatisch hier hinein und sendet Enter.</p>
      <form className="handscanner-form" onSubmit={absenden}>
        <input
          ref={inputRef}
          type="text"
          inputMode="numeric"
          className="handscanner-input"
          placeholder="Barcode scannen oder IMEI/S-Nummer eingeben…"
          value={wert}
          onChange={(e) => setWert(e.target.value)}
          autoFocus
        />
        <button type="submit" className="btn-primaer" style={{ padding: "0 20px" }}>Erfassen</button>
      </form>
      {rueckmeldung && <div className={`handscanner-rueckmeldung ${rueckmeldung.art}`}>{rueckmeldung.text}</div>}
    </Section>
  );
}

function BestandAbgleich({ standort, sessionId, einheiten, zubehoer, onScannen, onNeueListe, onTreffer, druckRef }) {
  const [suche, setSuche] = useState("");
  const gefunden = einheiten.filter((e) => e.gefunden).length;
  const gesamt = einheiten.length;
  const sucheNorm = suche.trim().toLowerCase();
  const gefiltert = sucheNorm
    ? einheiten.filter(
        (e) =>
          e.sn.includes(sucheNorm) ||
          e.artikelNummer.toLowerCase().includes(sucheNorm) ||
          e.name.toLowerCase().includes(sucheNorm)
      )
    : einheiten;
  return (
    <div>
      <BestandQr sessionId={sessionId} />
      <Section title="Abgleich">
        <p className="upload-hinweis">{standort.name}</p>
        <div className="abgleich-summe">
          <strong>{gefunden} / {gesamt}</strong>
          <span>erfasst</span>
        </div>
        <div className="abgleich-balken">
          <div className="abgleich-balken-fuellung" style={{ width: gesamt ? `${(gefunden / gesamt) * 100}%` : "0%" }} />
        </div>
        <div className="abgleich-aktionen">
          <button type="button" className="btn-primaer" onClick={onScannen}>Scannen</button>
          <button type="button" className="btn-sekundaer" onClick={onNeueListe}>Neue Liste</button>
        </div>
      </Section>
      <HandscannerEingabe einheiten={einheiten} onTreffer={onTreffer} />
      <Section title={`Liste (${gesamt})`}>
        <input
          type="text"
          className="such-feld"
          placeholder="Artikel, Artikel-Nummer oder IMEI/S-Nummer suchen…"
          value={suche}
          onChange={(e) => setSuche(e.target.value)}
        />
        <ul className="abgleich-liste">
          {gefiltert.map((e) => (
            <li key={e.sn} className={e.gefunden ? "gefunden" : ""}>
              <span className="abgleich-status">{e.gefunden ? "✓" : ""}</span>
              <span className="abgleich-name">{e.name}</span>
              <span className="abgleich-sn">{e.sn}</span>
            </li>
          ))}
        </ul>
        {sucheNorm && gefiltert.length === 0 && <p className="historie-status">Keine Treffer.</p>}
      </Section>
      {zubehoer && zubehoer.length > 0 && (
        <Section title={`Zubehör ohne Seriennummer (${zubehoer.length})`}>
          <ul className="abgleich-liste">
            {zubehoer.map((z) => (
              <li key={z.artikelNummer}>
                <span className="abgleich-status"></span>
                <span className="abgleich-name">{z.name}</span>
                <span className="abgleich-sn">× {z.menge}</span>
              </li>
            ))}
          </ul>
        </Section>
      )}
      <div className="aktionen">
        <button type="button" className="btn-sekundaer" onClick={() => window.print()}>Drucken</button>
        <button type="button" className="btn-primaer" onClick={() => erstellePdf(druckRef.current, `Bestandsabgleich_${standort.id}_${heuteISO()}`)}>Als PDF speichern</button>
      </div>
    </div>
  );
}

function liesSessionIdAusURL() {
  return new URLSearchParams(window.location.search).get("bestand") || null;
}

function Bestandsfuehrung({ standort }) {
  const [sessionId, setSessionId] = useState(liesSessionIdAusURL);
  const [sessionStandort, setSessionStandort] = useState(null);
  const [zubehoer, setZubehoer] = useState([]);
  const [kopf, setKopf] = useState({ shopNummer: "", shopName: "", loginKuerzel: "" });
  const [einheiten, setEinheiten] = useState(null);
  const [scannerOffen, setScannerOffen] = useState(false);
  const [fehlerText, setFehlerText] = useState("");
  const druckRef = useRef(null);

  useEffect(() => {
    if (!sessionId) {
      setEinheiten(null);
      setSessionStandort(null);
      setZubehoer([]);
      setKopf({ shopNummer: "", shopName: "", loginKuerzel: "" });
      return;
    }
    setFehlerText("");
    let aktiv = true;
    db.collection("bestandssessions").doc(sessionId).get()
      .then((doc) => {
        if (!aktiv) return;
        if (!doc.exists) {
          setFehlerText("Sitzung nicht gefunden oder abgelaufen.");
          return;
        }
        const d = doc.data();
        setSessionStandort({ id: d.standortId, name: d.standortName, marke: d.marke });
        setZubehoer(d.zubehoer || []);
        setKopf({ shopNummer: d.shopNummer || "", shopName: d.shopName || "", loginKuerzel: d.loginKuerzel || "" });
      })
      .catch((err) => aktiv && setFehlerText(speicherfehlertext(err)));

    const unsub = db.collection("bestandssessions").doc(sessionId).collection("einheiten").onSnapshot(
      (snap) => aktiv && setEinheiten(snap.docs.map((d) => ({ sn: d.id, ...d.data() }))),
      (err) => aktiv && setFehlerText(speicherfehlertext(err))
    );
    return () => {
      aktiv = false;
      unsub();
    };
  }, [sessionId]);

  function sessionErstellt(id) {
    const url = new URL(window.location.href);
    url.searchParams.set("bestand", id);
    window.history.replaceState({}, "", url);
    setSessionId(id);
  }

  function neueListe() {
    const url = new URL(window.location.href);
    url.searchParams.delete("bestand");
    window.history.replaceState({}, "", url);
    setSessionId(null);
  }

  async function treffer(sn) {
    try {
      await markiereGefunden(sessionId, sn);
    } catch (err) {
      setFehlerText(speicherfehlertext(err));
    }
  }

  if (!sessionId) {
    return <BestandUpload standort={standort} onFertig={sessionErstellt} />;
  }
  if (fehlerText && !einheiten) {
    return <div className="fehler-banner" style={{ margin: "16px 0" }}>{fehlerText}</div>;
  }
  if (!einheiten || !sessionStandort) {
    return <p className="historie-status">Sitzung wird geladen…</p>;
  }

  return (
    <div>
      <BestandAbgleich
        standort={sessionStandort}
        sessionId={sessionId}
        einheiten={einheiten}
        zubehoer={zubehoer}
        onScannen={() => setScannerOffen(true)}
        onNeueListe={neueListe}
        onTreffer={treffer}
        druckRef={druckRef}
      />
      {fehlerText && <div className="fehler-banner" style={{ margin: "0 16px 16px" }}>{fehlerText}</div>}
      {scannerOffen && <Kamerascanner einheiten={einheiten} onTreffer={treffer} onClose={() => setScannerOffen(false)} />}
      <div className="druckbereich" ref={druckRef}>
        <BestandDruckansicht standort={sessionStandort} einheiten={einheiten} zubehoer={zubehoer} kopf={kopf} />
      </div>
    </div>
  );
}

    setLaedt(true);
    auth.signInWithEmailAndPassword(email, pw)
      .catch((err) => setFehler(login_fehlertext(err)))
      .finally(() => setLaedt(false));
  }

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-icon">✓</div>
        <h1>Filialprotokoll</h1>
        <p className="login-sub">Anmeldung erforderlich</p>
        <form onSubmit={anmelden}>
          <label>
            E-Mail
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required autoFocus />
          </label>
          <label>
            Passwort
            <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} required />
          </label>
          {fehler && <div className="login-fehler">{fehler}</div>}
          <button type="submit" disabled={laedt}>{laedt ? "Anmelden…" : "Anmelden"}</button>
        </form>
      </div>
    </div>
  );
}

function SplashLoader() {
  return (
    <div className="login-wrap">
      <div className="login-icon" style={{ margin: "0 auto" }}>✓</div>
    </div>
  );
}

// ===== Kopfbereich + Hauptapp =====
function Kopfbereich({ standort, onStandortWechsel, datum, onDatumWechsel, bereich, onBereichWechsel, tab, onTabWechsel }) {
  return (
    <header className="kopf">
      <div className="kopf-marke">
        <span className="kopf-badge">{standort.marke === "telekom" ? "T" : "o2"}</span>
        <h1>Filialprotokoll</h1>
        <button type="button" className="abmelden-btn" onClick={() => auth.signOut()}>Abmelden</button>
      </div>
      <div className="kopf-felder">
        <select className="standort-select" value={standort.id} onChange={(e) => onStandortWechsel(e.target.value)}>
          {STANDORTE.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <input className="datum-input" type="date" value={datum} onChange={(e) => onDatumWechsel(e.target.value)} />
      </div>
      <nav className="hauptmenue">
        <button type="button" className={bereich === "kassencheck" ? "aktiv" : ""} onClick={() => onBereichWechsel("kassencheck")}>Kassencheck</button>
        <button type="button" className={bereich === "bestand" ? "aktiv" : ""} onClick={() => onBereichWechsel("bestand")}>O2 Bestandsführung</button>
      </nav>
      {bereich === "kassencheck" && (
        <nav className="tabs">
          <button type="button" className={tab === "neu" ? "aktiv" : ""} onClick={() => onTabWechsel("neu")}>Neues Protokoll</button>
          <button type="button" className={tab === "historie" ? "aktiv" : ""} onClick={() => onTabWechsel("historie")}>Historie</button>
        </nav>
      )}
    </header>
  );
}

function Hauptapp() {
  const [bereich, setBereich] = useState(() => (liesSessionIdAusURL() ? "bestand" : "kassencheck"));
  const [tab, setTab] = useState("neu");
  const [standortId, setStandortId] = useState(STANDORTE[0].id);
  const [datum, setDatum] = useState(heuteISO());
  const standort = STANDORTE.find((s) => s.id === standortId) || STANDORTE[0];

  return (
    <div className={`app-shell ${standort.marke}`}>
      <Kopfbereich standort={standort} onStandortWechsel={setStandortId} datum={datum} onDatumWechsel={setDatum} bereich={bereich} onBereichWechsel={setBereich} tab={tab} onTabWechsel={setTab} />
      <main>
        {bereich === "bestand" ? (
          <Bestandsfuehrung key={standort.id} standort={standort} />
        ) : tab === "neu" ? (
          <NeuesProtokoll key={standort.id + datum} standort={standort} datum={datum} onGespeichert={() => setTab("historie")} />
        ) : (
          <Historie standort={standort} />
        )}
      </main>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(undefined);
  useEffect(() => auth.onAuthStateChanged(setUser), []);
  if (user === undefined) return <SplashLoader />;
  if (user === null) return <Login />;
  return <Hauptapp />;
}

class Fehlergrenze extends React.Component {
  constructor(props) {
    super(props);
    this.state = { fehler: null };
  }
  static getDerivedStateFromError(fehler) {
    return { fehler };
  }
  componentDidCatch(fehler, info) {
    console.error("Unerwarteter Fehler:", fehler, info);
  }
  render() {
    if (this.state.fehler) {
      return (
        <div className="login-wrap">
          <div className="login-card">
            <div className="login-icon" style={{ background: "var(--warn)" }}>!</div>
            <h1>Etwas ist schiefgelaufen</h1>
            <p className="login-sub">{this.state.fehler.message || "Unerwarteter Fehler."}</p>
            <button
              type="button"
              onClick={() => window.location.reload()}
              style={{ padding: "13px", borderRadius: "11px", border: "none", background: "var(--accent)", color: "#fff", fontSize: "15px", fontWeight: "600", cursor: "pointer" }}
            >
              Neu laden
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <Fehlergrenze>
    <App />
  </Fehlergrenze>
);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body>
